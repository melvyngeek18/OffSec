name: OffSec Surface PWA
on:
  workflow_dispatch:
  push:
    branches: [feature/offsec-surface-pwa]
    paths: ['frontend/**', '.github/workflows/offsec-pwa.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: offsec-surface-pwa
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Verify Expo setup
        run: |
          node -e "console.log('Expo:',require('expo/package.json').version,'React Native:',require('react-native/package.json').version)"
          npx expo config --type public > /tmp/offsec-pwa-config.json
          node -e "const ts=require('typescript'); console.log('TypeScript:',ts.version); if(typeof ts.sys?.getCurrentDirectory!=='function')throw Error('TypeScript sys.getCurrentDirectory missing')"
      - name: Bundle local face detection model and WASM
        run: |
          mkdir -p public/mediapipe/wasm
          cp node_modules/@mediapipe/tasks-vision/wasm/* public/mediapipe/wasm/
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.js public/mediapipe/vision_bundle.js
          test -s public/mediapipe/vision_bundle.js
          curl --fail --location --retry 3 --output public/mediapipe/face_detector.tflite https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite
          test -s public/mediapipe/face_detector.tflite
      - name: Export installable web app
        run: |
          set -o pipefail
          CI=1 EXPO_DEBUG=1 npx expo export --platform web 2>&1 | tee /tmp/offsec-web-export.log
      - name: Report web export failure details
        if: failure()
        run: |
          echo "::group::Web bundler error details"
          grep -n -i -E 'error:|unable to resolve|module not found|cannot resolve|syntaxerror|bundling failed|exception|failed to resolve' /tmp/offsec-web-export.log | tail -60 || true
          tail -100 /tmp/offsec-web-export.log || true
          echo "::endgroup::"
      - name: Precache static PWA files
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='dist',files=[];
          function crawl(dir){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,entry.name);if(entry.isDirectory())crawl(p);else if(/\.(html|js|css|woff2?|png|svg|webp|json|webmanifest|wasm|tflite)$/.test(entry.name))files.push('/OffSec/'+path.relative(root,p).split(path.sep).join('/'));}}
          crawl(root);
          const sw=path.join(root,'offsec-sw.js');
          if(!fs.existsSync(sw))throw Error('Missing service worker in dist');
          const assets=files.filter(p=>p!=='/OffSec/offsec-sw.js');
          const source=fs.readFileSync(sw,'utf8');
          fs.writeFileSync(sw,'self.__OFFSEC_ASSETS='+JSON.stringify(assets)+';\n'+source);
          console.log('PWA precache files:',assets.length);
          NODE
      - name: Verify web export
        run: test -f dist/index.html && test -f dist/manifest.webmanifest && test -f dist/offsec-sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: OffSec-PWA-Surface
          path: frontend/dist
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
