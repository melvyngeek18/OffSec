name: OffSec Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/offsec-ui-photo-ia
    paths:
      - 'frontend/**'
      - '.github/workflows/offsec-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/cmdline-tools"
          echo "GitHub-hosted Android SDK detected"
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Validate Expo configuration
        run: |
          node -v
          npm -v
          npx expo config --type prebuild > /tmp/offsec-expo-config.txt
          npx expo install --check || echo "::warning::Des dependances Expo doivent etre realignees dans package.json"
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace --console=plain
      - name: Report failure details
        if: failure()
        run: |
          echo "ETAPE EN ECHEC: ouvrir le premier bloc rouge du job."
          echo "Node $(node --version); npm $(npm --version)"
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then echo "APK present malgre erreur"; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OffSec-Android-debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
