name: OffSec Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/offsec-ui-photo-ia
    paths:
      - 'frontend/**'
      - '.github/workflows/offsec-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/cmdline-tools"
          echo "GitHub-hosted Android SDK detected"
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Validate clean Expo CLI installation
        run: |
          node -e "const fs=require('fs'); const p=require.resolve('@expo/cli/package.json'); const path=require('path'); const root=path.dirname(p); const f=path.join(root,'build/src/install/utils/autoAddConfigPlugins.js'); console.log('CLI:',p); if(!fs.existsSync(f)){console.log('Expo CLI internal file absent; do not run expo install --fix');}"
          node -e "console.log('Expo',require('expo/package.json').version,'CLI',require('@expo/cli/package.json').version)"
          npx expo config --type prebuild > /tmp/offsec-expo-config.txt
          npm ls expo expo-modules-autolinking react-native --all || true
          npx expo-doctor || echo '::warning::Expo doctor a signale des problemes a verifier'
          node -e "const a=require('expo-modules-autolinking/package.json'); console.log('Expo autolinking version:', a.version)"
          npm ls expo-ai-kit --all || true
          npx expo-modules-autolinking verify -v || true
      - name: Confirm native module alignment
        run: |
          node -e "const pkg=require('./package.json'); if(pkg.dependencies['expo-ai-kit'])process.exit(1); console.log('Legacy native plugin absent')"
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Diagnose Expo publication metadata before Gradle
        run: |
          set +e
          npx expo-modules-autolinking resolve --platform android --json > /tmp/offsec-resolve.json 2> /tmp/offsec-resolve.err
          code=$?
          echo "Autolinking exit code: $code"
          cat /tmp/offsec-resolve.err
          node - <<'NODE'
          const fs=require('fs');
          const file='/tmp/offsec-resolve.json';
          try {
            const obj=JSON.parse(fs.readFileSync(file,'utf8'));
            let count=0;
            function walk(o,at='root') {
              if(!o || typeof o!=='object')return;
              if(o.publication && typeof o.publication==='object' && !o.publication.version) {
                console.log('::error::Missing publication.version at '+at+': '+JSON.stringify(o.publication));
                count++;
              }
              for(const [k,v] of Object.entries(o)) if(typeof v==='object')walk(v,at+'.'+k);
            }
            walk(obj); console.log('Publication entries missing version:',count);
            if(count)process.exitCode=1;
          }catch(e){console.log('Autolinking JSON unavailable:',String(e));}
          NODE
          if [ "$code" -ne 0 ]; then exit "$code"; fi
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace --console=plain
      - name: Report failure details
        if: failure()
        run: |
          echo "ETAPE EN ECHEC: ouvrir le premier bloc rouge du job."
          echo "Node $(node --version); npm $(npm --version)"
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then echo "APK present malgre erreur"; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OffSec-Android-debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
